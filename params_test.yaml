# Project name

projectName: run1



# Input and output files and directories
#
# fasta : path to one or more FASTA files containing the sequences to be analyzed.
#         These files serve as the input data for the workflow.
#
# outdir : output directory where all results generated by the analysis
#          (including files produced by LAGOON-MCL) will be saved.
#          The directory will be created if it does not exist.

fasta: "${projectDir}/data-test/fasta/*.fasta"
outdir: "${projectDir}/results"



# Parameters for scanning the Pfam database
#
# LAGOON-MCL uses MMseqs2 to align the input sequences
# against the Pfam database. This step allows functional
# annotations to be assigned to the analyzed sequences.
#
# If you already have your own functional annotations,
# this step can be disabled.
#
# scan_pfam : true / false
#     true  : LAGOON-MCL aligns the sequences against the Pfam database
#             using MMseqs2 and generates functional annotations.
#     false : LAGOON-MCL does not perform alignment against Pfam
#             (no functional annotations are produced in this step).
#
# When Pfam scanning is enabled, it is necessary to provide
# LAGOON-MCL with a Pfam database in a format compatible with MMseqs2.
#
# pfam_path : path to the directory containing the Pfam database
# pfam_name : name of the Pfam database as defined when it was created
#
# The Pfam database can be built using the script:
# tool-kit/build_pfam_db.sh

scan_pfam: true
pfam_path: "${projectDir}/database/pfamDB"
pfam_name: "pfamDB"



# Parameters for scanning the AlphaFold clusters database
# (https://cluster.foldseek.com/)
#
# LAGOON-MCL uses MMseqs2 to align the input sequences
# against the AlphaFold clusters database. This step allows
# the assignment of predicted three-dimensional structures
# (from AlphaFold) to the analyzed sequences.
#
# It is necessary to provide LAGOON-MCL with an AlphaFold clusters
# database in a format compatible with MMseqs2.
#
# alphafold_path : path to the directory containing the AlphaFold clusters database
#
# alphafold_name : name of the AlphaFold clusters database as defined when created
#
# uniprot : enables retrieval of Pfam annotations associated with
#           the UniProt identifiers of sequences present in the
#           AlphaFold clusters database
#
# Both the Pfam annotations and the AlphaFold clusters database
# can be obtained and built using the script:
# tool-kit/build_alphafold_db.sh

alphafold_path: "${projectDir}/database/alphafoldDB"
alphafold_name: "alphafoldDB"
uniprot: "${projectDir}/database/uniprot_function.json"



# If you have annotation files for your sequences,
# you can provide LAGOON-MCL with a CSV table specifying
# the type of annotation and the path to each file.
#
# The CSV file must contain the following columns:
#   - column 1: annotation (name or type of annotation)
#   - column 2: file (path to the annotation file)
#
# Example (data-test/annotationsheet.csv):
# annotation,file
# funfam,data-test/labels/funfam.tsv
# tmhmm,data-test/labels/tmhmm.tsv
# gene3d,data-test/labels/gene3d.tsv
#
# Each annotation file must map sequence identifiers to
# the corresponding annotations, following the format expected
# by LAGOON-MCL.
#
# If you do not have annotation files,
# set the parameter annotation to null.
#
# /\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\
# \/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/\/
#
# Format of annotation files (TSV)
#
# Annotation files must be in TSV format (tab-separated)
# and contain exactly two columns, without a header.
#
#   - Column 1: sequence identifier
#               (must match the identifiers in the FASTA files)
#
#   - Column 2: annotation identifier(s)
#               One or more annotations can be associated with a single sequence.
#               If there are multiple annotations, they must be separated by a
#               semicolon (;).
#
# Example (data-test/labels/gene3d.tsv):
# sequence_id                       	label
# MALV-I-01_sp_EP00398|sequence00079	G3DSA:3.40.50.300;G3DSA:1.10.8.60;G3DSA:2.30.30.190
# MALV-I-01_sp_EP00398|sequence00009	G3DSA:3.30.60.90
# MALV-I-01_sp_EP00398|sequence00443	G3DSA:1.25.10.10
# MALV-I-01_sp_EP00398|sequence00399	G3DSA:3.40.630.30
# MALV-I-01_sp_EP00398|sequence00573	G3DSA:1.25.40.20
# MALV-I-01_sp_EP00398|sequence00985	G3DSA:2.130.10.10
# MALV-I-01_sp_EP00398|sequence00545	G3DSA:1.10.287.3240
#
# Any sequence missing from the annotation file will be considered unannotated.

annotation: "${projectDir}/data-test/annotationsheet.csv"



# Construction of the sequence similarity network
#
# LAGOON-MCL builds a sequence similarity network by performing
# an all-vs-all alignment of the sequences using Diamond BLASTp
# (https://github.com/bbuchfink/diamond).
# The resulting alignments are then used to define
# the edges between sequences in the network.
#
# sensitivity : Diamond sensitivity mode
#     Possible values:
#       - fast            : very fast execution, low sensitivity
#       - mid-sensitive   : balance between speed and sensitivity
#       - sensitive       : high sensitivity
#       - very-sensitive  : very high sensitivity
#       - ultra-sensitive : maximum sensitivity, longer runtime
#
# matrix : substitution matrix used for scoring alignments
#     Possible values:
#       BLOSUM45, BLOSUM50, BLOSUM62, BLOSUM80, BLOSUM90,
#       PAM250, PAM70, PAM30
#
# evalue : maximum E-value to report an alignment.

alignment_file: null
sensitivity: "very-sensitive"
matrix: "BLOSUM62"
evalue: 0.001



# Protein clustering using the Markov Clustering (MCL) algorithm
#
# To construct protein clusters, the Markov Clustering (MCL) algorithm
# is applied to the sequence similarity network obtained from Diamond alignments.
#
# The granularity of clustering can be controlled using the inflation parameter (I).
#   - Higher I values result in finer clustering
#     (smaller, more specific clusters).
#   - Lower I values result in coarser clustering
#     (larger clusters).
#
# I : MCL inflation parameter.
#     Multiple values can be provided, separated by commas,
#     to generate multiple sets of clusters.
#     Example: I: "1.4,2,4"
#
# max_weight : allows capping the weight of network edges
#              at a maximum value before applying MCL.
#              This prevents a few very strong similarities
#              from dominating the clustering.
#
# cluster_size : minimum cluster size to retain.
#                Clusters with fewer sequences than this threshold
#                are ignored or filtered from the final results.

I: "1.4"
max_weight: 200 
cluster_size: 2